[package]
name = "resplay-gui"
version = "0.0.0"
edition = "2024"

[dependencies]
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["persistence", "wayland", "glow", "default_fonts"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
resplay-core = { path = "../resplay-core" }
rfd = "0.18"
bitflags = "2"
ringbuf = "0.6"
indexmap = { version = "2", features = ["serde"] }

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
pollster = "1"
cpal = "0.18"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
wasm-bindgen = "0.2"
cpal = { version = "0.18", features = ["wasm-bindgen"] }
